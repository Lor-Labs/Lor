server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache forever, and 404 when missing so stale
    # clients get a clean module-load error instead of the SPA fallback HTML.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html (and the SPA fallback) must revalidate on every load so a
    # deploy is picked up immediately and never references dead chunks.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
