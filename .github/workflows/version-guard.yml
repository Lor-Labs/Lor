name: Desktop Version Guard

# The desktop app bundles the web frontend, so whenever a PR changes anything
# that ships in that bundle, the desktop version in tauri.conf.json must be
# bumped past the latest RELEASED version — otherwise web deploys but the
# desktop release drifts behind. The baseline is the newest v* git tag (the real
# released version), not just the committed file: bumping to an already-tagged
# version would make auto-tag skip and cut no build, which is the drift we're
# preventing. Mark this a required status check on main so it gates merges.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-guard:
    name: Require desktop version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tauri.conf.json version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          conf="apps/desktop/src-tauri/tauri.conf.json"

          # Paths that do NOT ship in the desktop bundle (backend apps, server-only
          # packages, docs, CI). A PR touching only these needs no desktop release.
          # Everything else — apps/web, apps/desktop, packages/ui, shared frontend
          # packages, root config — requires a version bump. Edit as the repo grows.
          safe_re='^(apps/(api|realtime|worker|www)|packages/(lor|db|auth)|reference|\.github)/|\.md$'

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          remaining="$(printf '%s\n' "$changed" | grep -Ev "$safe_re" || true)"

          if [ -z "$remaining" ]; then
            echo "No bundled-frontend changes in this PR — desktop version bump not required."
            exit 0
          fi

          # Make sure tags are present (release history lives in v* tags).
          git fetch --tags --force >/dev/null 2>&1 || true

          base_v="$(git show "$BASE_SHA:$conf" | jq -r '.version')"
          head_v="$(git show "$HEAD_SHA:$conf" | jq -r '.version')"
          latest_tag_v="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"

          # The new version must clear the highest of {committed on main, latest
          # released tag}. Clearing the tag is what guarantees auto-tag creates a
          # fresh tag and actually builds — a bump to an already-tagged version
          # would be silently skipped.
          baseline="$base_v"
          if [ -n "$latest_tag_v" ]; then
            baseline="$(printf '%s\n%s\n' "$base_v" "$latest_tag_v" | sort -V | tail -1)"
          fi
          next_v="$(echo "$baseline" | awk -F. '{ $3 = $3 + 1; print $1"."$2"."$3 }')"

          echo "Committed on main:   $base_v"
          echo "Latest released tag: ${latest_tag_v:-<none>}"
          echo "Baseline to clear:   $baseline"
          echo "This PR's version:   $head_v"
          echo "Frontend files changed:"
          printf '%s\n' "$remaining" | sed 's/^/  /'

          highest="$(printf '%s\n%s\n' "$baseline" "$head_v" | sort -V | tail -1)"
          if [ "$head_v" = "$baseline" ] || [ "$highest" != "$head_v" ]; then
            echo "::error::This PR changes the bundled frontend but its desktop version ($head_v) does not exceed the latest released version ($baseline). Set \".version\" in $conf to $next_v or higher so a new tag — and a new desktop build — is actually cut."
            exit 1
          fi

          echo "Desktop version $head_v clears baseline $baseline ✔ — will cut a fresh release."
