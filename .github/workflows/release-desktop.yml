name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      # The committed conf keeps signingIdentity "-" (ad-hoc) for local dev
      # builds; CI overwrites it with the real Developer ID so notarization
      # works, avoiding any precedence ambiguity with APPLE_SIGNING_IDENTITY.
      - name: Set version and signing identity
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          conf="apps/desktop/src-tauri/tauri.conf.json"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" --arg id "$APPLE_SIGNING_IDENTITY" \
            '.version = $v
             | (if $id != "" then .bundle.macOS.signingIdentity = $id else . end)' \
            "$conf" > "$tmp"
          mv "$tmp" "$conf"
          echo "building version $VERSION"

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # Build only — no tagName/releaseName, so no GitHub release is created.
      # The web frontend is bundled via beforeBuildCommand; NEXT_PUBLIC_* are
      # baked in by Vite at build time and must be present here.
      - name: Build Tauri app (universal macOS)
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_REALTIME_URL: ${{ secrets.NEXT_PUBLIC_REALTIME_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin

      # Assemble latest.json (tauri-action only generates it for GitHub release
      # uploads) and publish artifacts + manifest to Cloudflare R2.
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: lor-releases
          RELEASES_BASE_URL: https://releases.lor.chat
        run: |
          set -eu
          VERSION="$APP_VERSION"
          TARGET_DIR="apps/desktop/src-tauri/target"

          TARBALL="$(find "$TARGET_DIR" -name '*.app.tar.gz' | head -1)"
          SIG="$(find "$TARGET_DIR" -name '*.app.tar.gz.sig' | head -1)"
          DMG="$(find "$TARGET_DIR" -name '*.dmg' | head -1)"

          if [ -z "$TARBALL" ] || [ -z "$SIG" ]; then
            echo "::error::updater artifacts (.app.tar.gz / .sig) not found under $TARGET_DIR" >&2
            exit 1
          fi

          TARBALL_NAME="$(basename "$TARBALL")"
          SIGNATURE="$(cat "$SIG")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="$RELEASES_BASE_URL/$VERSION/$TARBALL_NAME"

          # Universal binary runs on both arches, so both platform keys point at it.
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Lor $VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg sig "$SIGNATURE" \
            --arg url "$URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $sig, url: $url },
                "darwin-x86_64":  { signature: $sig, url: $url }
              }
            }' > latest.json

          s3() { aws s3 cp --endpoint-url "$R2_ENDPOINT" "$@"; }

          # Versioned artifacts are immutable — let the CDN cache them hard.
          IMMUTABLE="public, max-age=31536000, immutable"
          # Mutable pointers must never be cached, or the updater/downloads go stale.
          NOCACHE="no-cache, max-age=0, must-revalidate"

          s3 --cache-control "$IMMUTABLE" "$TARBALL" "s3://$R2_BUCKET/$VERSION/$TARBALL_NAME"
          s3 --cache-control "$IMMUTABLE" "$SIG"     "s3://$R2_BUCKET/$VERSION/$TARBALL_NAME.sig"
          s3 --cache-control "$IMMUTABLE" latest.json "s3://$R2_BUCKET/$VERSION/latest.json"
          if [ -n "$DMG" ]; then
            s3 --cache-control "$IMMUTABLE" "$DMG" "s3://$R2_BUCKET/$VERSION/$(basename "$DMG")"
            # Stable path for the marketing "Download for Mac" button.
            s3 --cache-control "$NOCACHE" "$DMG" "s3://$R2_BUCKET/latest/Lor_universal.dmg"
          fi

          # Root manifest — the updater endpoint the app polls; must stay fresh.
          s3 --cache-control "$NOCACHE" latest.json "s3://$R2_BUCKET/latest.json"

          echo "published $VERSION to $RELEASES_BASE_URL"
